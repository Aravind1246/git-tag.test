
# Application Configuration
application:
  name: Aravionx-Security
  version: "1.10.0"
  environment: producation

server:
  hostname: localhost
  port: 9090
  protocol: https

database:
  type: mysql
  host: 127.0.0.100
  port: 3306
  database_name: security_db

security:
  authentication: true
  firewall: enabled
  encryption: AES256

monitoring:
  enabled: true
  log_level: DEBUG
  backup: weekly

